[package]
name = "ctxl"
version = "0.1.0"
edition = "2021"
description = "Context ledger CLI — per-session SQLite store for tool output"
license = "Apache-2.0"
repository = "https://github.com/verve-sh/ctxl"
publish = false

[lints.clippy]
too_many_arguments = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"

[lints.rust]
missing_docs = "warn"

[[bin]]
name = "ctxl"
path = "src/main.rs"

[lib]
name = "ctxl"
path = "src/lib.rs"

[features]
default = []
lang-rust       = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-python     = ["dep:tree-sitter-python"]
lang-go         = ["dep:tree-sitter-go"]
lang-java       = ["dep:tree-sitter-java"]
lang-c          = ["dep:tree-sitter-c"]
lang-cpp        = ["dep:tree-sitter-cpp"]
lang-ruby       = ["dep:tree-sitter-ruby"]
lang-bash       = ["dep:tree-sitter-bash"]
lang-css        = ["dep:tree-sitter-css"]
lang-json       = ["dep:tree-sitter-json"]
all-languages = [
    "lang-rust", "lang-typescript", "lang-javascript", "lang-python", "lang-go",
    "lang-java", "lang-c", "lang-cpp", "lang-ruby", "lang-bash", "lang-css", "lang-json",
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
strip-ansi-escapes = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
simhash = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
flatten-json-object = "0.6"
tokenx-rs = "0.1"
htmd = "0.1"

# Tree-sitter core — always present; grammars are optional.
tree-sitter = "0.22"

# Tree-sitter grammars (optional; enabled via feature flags).
tree-sitter-rust       = { version = "0.21", optional = true }
tree-sitter-typescript = { version = "0.21", optional = true }
tree-sitter-javascript = { version = "0.21", optional = true }
tree-sitter-python     = { version = "0.21", optional = true }
tree-sitter-go         = { version = "0.21", optional = true }

# Extended grammars (all-languages only).
tree-sitter-java  = { version = "0.21", optional = true }
tree-sitter-c     = { version = "0.21", optional = true }
tree-sitter-cpp   = { version = "0.22", optional = true }
tree-sitter-ruby  = { version = "0.21", optional = true }
tree-sitter-bash  = { version = "0.21", optional = true }
tree-sitter-css   = { version = "0.21", optional = true }
tree-sitter-json  = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
strip-ansi-escapes = "0.2"
